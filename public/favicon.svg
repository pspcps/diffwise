<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="psGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="psBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141834" />
      <stop offset="100%" stop-color="#070914" />
    </linearGradient>
    <linearGradient id="psStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.4" />
    </linearGradient>
    <filter id="psGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer rounded container -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#psBg)" stroke="url(#psStroke)" stroke-width="1.75" />

  <!-- Code bracket left: '<' -->
  <path d="M14 18L8.5 24L14 30" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

  <!-- Code bracket right: '>' -->
  <path d="M34 18L39.5 24L34 30" stroke="#a855f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

  <!-- 'P' monogram glyph -->
  <path d="M19 16V32M19 16H23.5C25.433 16 27 17.567 27 19.5C27 21.433 25.433 23 23.5 23H19" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- 'S' monogram electric stroke -->
  <path d="M29 25C28 23.8 26.2 23.6 24.8 24.5C23.2 25.6 23.8 27.6 25.4 28.4C27.5 29.4 27.8 30.8 26.8 31.8C25.6 32.8 23.4 32.6 21.8 31.5" stroke="url(#psGrad)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Accent glow dot -->
  <circle cx="28.5" cy="16" r="1.6" fill="#38bdf8" filter="url(#psGlow)" />
</svg>